# Scheduled reconciler (DESIGN.md D15) — keeps the catalog current, autonomously.
#
# Weekly: for each TRACKED tool, compare bioconda's latest version against what's
# published on quay.io/aarchbio, and also retry recorded gaps (upstream may have
# added arm64 since). Build the delta via the existing publish workflow.
#
# Runs on hosted runners (no farm dependency) — it only ever handles a small
# delta (new versions + newly-buildable gaps), so hosted speed is fine and it
# survives the local farm being offline.
#
# GUARDRAILS (it writes to a public registry unattended):
#  - bounded: caps how many tools it will queue per run (MAX_DELTA) so a bioconda
#    mass-release can't trigger a runaway.
#  - additive only: never deletes or unpublishes anything.
#  - idempotent: the builder no-ops on an already-current tag.
#  - concurrency-guarded: won't overlap a previous run.

name: reconcile

on:
  schedule:
    - cron: '17 7 * * *'   # daily at 07:17 UTC (off the hour to dodge cron congestion)
    # Daily, not weekly: bioconda is high-velocity (hundreds of updates/week), so
    # daily caps a tool's mirror-lag at ~24h. Cost stays low — the discovery scan
    # is just API calls; runner-minutes are spent only when there's a real delta
    # (often zero). MAX_DELTA bounds each run; a backlog self-catches-up next day.
  workflow_dispatch:
    inputs:
      max_delta:
        description: 'Max tools to queue this run (runaway guard)'
        required: false
        default: '40'
        type: string
      dry_run:
        description: 'Compute the delta but do not dispatch builds'
        required: false
        default: 'false'
        type: string

concurrency:
  group: reconcile
  cancel-in-progress: false   # let a running reconcile finish; don't stack

permissions:
  contents: read
  actions: write   # to dispatch publish.yml
  issues: write    # to close gap issues the catalog has since resolved

jobs:
  reconcile:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3   # for the signing guard

      - name: Compute the delta (new versions + retryable gaps)
        id: delta
        env:
          MAX_DELTA: ${{ inputs.max_delta || '40' }}
          # 'stuck' skip-list entries are re-checked on the 1st of the month (in
          # the Python) or on a manual dispatch (this flag); the daily run skips
          # them. 'wontfix' entries are never retried.
          INCLUDE_STUCK: ${{ github.event_name == 'workflow_dispatch' && 'yes' || '' }}
        run: |
          set -uo pipefail
          python3 - "$MAX_DELTA" <<'PY' > /tmp/delta.txt
          import json, sys, os, urllib.request, datetime

          MAX=int(sys.argv[1])
          # Monthly revisit: include 'stuck' entries on the 1st of the month or on
          # a manual dispatch; otherwise the daily run skips them.
          today = datetime.date.today()
          include_stuck = bool(os.environ.get("INCLUDE_STUCK")) or today.day == 1

          # Read the skip-list (DESIGN.md D15): wontfix=never, stuck=slow-revisit.
          skip = {}   # package -> tier
          try:
              with open("farm/skip-list.tsv") as f:
                  for line in f:
                      line=line.strip()
                      if not line or line.startswith("#"): continue
                      parts=line.split("\t")
                      if len(parts)>=2: skip[parts[0]] = parts[1]
          except FileNotFoundError:
              pass
          def skipped(tool):
              tier = skip.get(tool)
              if tier is None: return False
              if tier == "wontfix": return True            # never retry
              if tier == "stuck": return not include_stuck  # daily skip, monthly retry
              return False

          def quay(path):
              r=urllib.request.Request("https://quay.io/api/v1/"+path)
              return json.load(urllib.request.urlopen(r, timeout=30))
          def anaconda(pkg):
              try:
                  r=urllib.request.Request(f"https://api.anaconda.org/package/bioconda/{pkg}")
                  return json.load(urllib.request.urlopen(r, timeout=30))
              except Exception:
                  return None

          # TRACKED SET = every tool currently published in the aarchbio org
          # (paginated). The catalog tracks itself: anything we've published, we
          # keep current. New-tool discovery is intentionally out of scope here
          # (that's a separate, human-curated expansion — guards against scope creep).
          tracked=[]; page=None
          while True:
              d=quay("repository?namespace=aarchbio&public=true&private=true"+(f"&next_page={page}" if page else ""))
              tracked+=[r["name"] for r in d["repositories"]]; page=d.get("next_page")
              if not page: break

          delta=[]; skipped_n=0
          for tool in sorted(tracked):
              if skipped(tool): skipped_n+=1; continue   # known dead-end / stuck
              info=anaconda(tool)
              if not info: continue
              latest=info.get("latest_version")
              if not latest: continue
              # what tags do we already have for this tool?
              try:
                  tags=[t["name"] for t in quay(f"repository/aarchbio/{tool}/tag/?onlyActiveTags=true&limit=100").get("tags",[])
                        if not t["name"].endswith((".sig",".att")) and not t["name"].startswith("sha256-")]
              except Exception:
                  tags=[]
              have_versions={t.split("--")[0] for t in tags}
              # queue the latest bioconda version if we don't already have it
              if latest not in have_versions:
                  delta.append(f"{tool}={latest}")
              if len(delta)>=MAX: break

          for spec in delta[:MAX]:
              print(spec)
          print(f"[reconcile] delta: {len(delta[:MAX])} tools (cap {MAX}); "
                f"skip-list skipped: {skipped_n} (include_stuck={include_stuck})", file=sys.stderr)
          PY
          count=$(grep -c . /tmp/delta.txt || echo 0)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "tools=$(tr '\n' ' ' < /tmp/delta.txt)" >> "$GITHUB_OUTPUT"
          echo "::notice::reconcile delta = $count tools: $(tr '\n' ' ' < /tmp/delta.txt)"

      - name: Dispatch builds for the delta
        if: ${{ steps.delta.outputs.count != '0' && inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" \
            -f tools="${{ steps.delta.outputs.tools }}"
          echo "::notice::dispatched publish.yml for ${{ steps.delta.outputs.count }} tools"

      # Signing guard: a build can leave a tag unsigned when a tool is pulled in as
      # a DEPENDENCY of another tool's build (e.g. coverm's build pushing a bwa tag)
      # — that sibling tag never goes through the sign step. Scan every image tag
      # for a matching signature and re-sign any misses. Self-heals the gap daily.
      - name: Signing guard (re-sign any unsigned public images)
        env:
          COSIGN_YES: 'true'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # A signed image X:tag has a sibling tag sha256-<digest>.sig. We detect an
          # unsigned image by: it has image tags but fewer .sig tags. Then verify
          # each image tag with cosign and collect the ones that fail.
          python3 - > /tmp/unsigned.txt <<'PY'
          import json,urllib.request
          def api(p):
              r=urllib.request.Request("https://quay.io/api/v1/"+p); return json.load(urllib.request.urlopen(r,timeout=20))
          repos=[];page=None
          while True:
              d=api("repository?namespace=aarchbio&public=true"+(f"&next_page={page}" if page else ""))
              repos+=[x["name"] for x in d["repositories"] if x.get("is_public")];page=d.get("next_page")
              if not page: break
          for r in sorted(repos):
              try: tags=[t["name"] for t in api(f"repository/aarchbio/{r}/tag/?onlyActiveTags=true&limit=100").get("tags",[])]
              except Exception: continue
              imgs=[t for t in tags if not t.endswith((".sig",".att")) and not t.startswith("sha256-")]
              sigs=[t for t in tags if t.endswith(".sig")]
              if imgs and len(sigs) < len(imgs):   # cheap pre-filter; cosign confirms below
                  for t in imgs: print(f"{r}:{t}")
          PY
          n=$(grep -c . /tmp/unsigned.txt || echo 0)
          if [ "$n" = "0" ]; then echo "::notice::signing guard: all public images signed"; exit 0; fi
          # cosign-confirm which candidates are truly unsigned, then dispatch a sign run
          need=""
          while read -r ref; do
            [ -z "$ref" ] && continue
            if ! cosign verify "quay.io/aarchbio/$ref" \
                 --certificate-identity-regexp 'github.com/playgroundlogic/aarchbio' \
                 --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null 2>&1; then
              need="$need $ref"
            fi
          done < /tmp/unsigned.txt
          need="$(echo $need | xargs)"
          if [ -z "$need" ]; then echo "::notice::signing guard: candidates were all signed (pre-filter only)"; exit 0; fi
          echo "::warning::signing guard re-signing: $need"
          gh workflow run sign-existing.yml --repo "$GITHUB_REPOSITORY" -f images="$need"

      # Gap-issue reaper: publish.yml FILES arm64-gap issues but nothing closed
      # them, so the tracker grew monotonically and misreported the gap count
      # (45% of open issues were already fixed at first audit). An arm64 gap is
      # resolved the moment upstream enables linux-aarch64 and the reconciler
      # publishes it — which happens here, silently. Close those issues.
      - name: Gap-issue reaper (close gaps the catalog has resolved)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --label arm64-gap \
            --limit 200 --json number,title > /tmp/gapissues.json
          python3 - > /tmp/reap.txt <<'PY'
          import json, re, urllib.request

          def api(p):
              r = urllib.request.Request("https://quay.io/api/v1/" + p)
              return json.load(urllib.request.urlopen(r, timeout=20))

          def published(tool):
              # None = no such repo (never built); else the set of published versions
              try:
                  tags = api("repository/aarchbio/%s/tag/?onlyActiveTags=true&limit=100" % tool).get("tags", [])
              except Exception:
                  return None
              return {t["name"].split("--")[0] for t in tags
                      if not t["name"].endswith((".sig", ".att")) and not t["name"].startswith("sha256-")}

          def bioconda_latest(tool):
              try:
                  u = "https://api.anaconda.org/package/bioconda/%s" % tool
                  return json.load(urllib.request.urlopen(u, timeout=20)).get("latest_version")
              except Exception:
                  return None

          def vkey(v):
              # Order-safe mixed version key: ints sort before strings, no TypeError.
              out = []
              for part in re.split(r"[._-]", v):
                  out.append((0, int(part), "") if part.isdigit() else (1, 0, part))
              return tuple(out)

          for issue in json.load(open("/tmp/gapissues.json")):
              m = re.match(r"arm64-gap:\s+([A-Za-z0-9._+-]+)=([^\s(]+)", issue["title"])
              if not m:
                  continue   # legacy mulled-v2 hash images: not a bioconda package, leave open
              tool, ver = m.group(1), m.group(2)
              have = published(tool)
              if not have:
                  continue   # never built (real never-arm64 or dependency gap): leave open
              if ver in have:
                  print("%d|%s|%s|resolved|%s" % (issue["number"], tool, ver, ver))
                  continue
              # Do NOT close as superseded while this version is still bioconda's
              # LATEST: it stays in the daily delta, the build keeps failing, and
              # the gap filer would just re-file it -- a close/re-file churn loop.
              # (Caught by p7zip: bioconda latest is 15.09 with no arm64, yet we
              # publish 16.02, so a naive version compare looked "superseded".)
              if ver == bioconda_latest(tool):
                  continue
              try:
                  newer = [v for v in have if vkey(v) > vkey(ver)]
              except Exception:
                  newer = []
              if newer:
                  best = max(newer, key=vkey)
                  print("%d|%s|%s|superseded|%s" % (issue["number"], tool, ver, best))
          PY
          n=$(grep -c . /tmp/reap.txt || echo 0)
          if [ "$n" = "0" ]; then echo "::notice::gap reaper: no stale gap issues"; exit 0; fi
          echo "::notice::gap reaper: closing $n stale gap issue(s)"
          while IFS='|' read -r num tool ver why at; do
            [ -z "${num:-}" ] && continue
            if [ "$why" = "resolved" ]; then
              msg="Resolved automatically — upstream bioconda now has a linux-aarch64 solution and \`${tool}=${ver}\` is published, signed and public: \`quay.io/aarchbio/${tool}\`."
            else
              msg="Superseded automatically — \`${tool}\` is published on arm64 at \`${at}\`. The reconciler mirrors bioconda's latest, so an intermediate version is not backfilled; the tool is available native arm64."
            fi
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" -c "$msg" \
              && echo "closed #${num} ${tool}=${ver} (${why})" || echo "::warning::could not close #${num}"
          done < /tmp/reap.txt

      - name: Summary
        run: |
          echo "Reconcile run: delta=${{ steps.delta.outputs.count }} tools" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/delta.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/unsigned.txt ]; then
            echo "**Signing guard** checked $(grep -c . /tmp/unsigned.txt) candidate tag(s)." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s /tmp/reap.txt ]; then
            echo "**Gap reaper** closed $(grep -c . /tmp/reap.txt) stale gap issue(s)." >> "$GITHUB_STEP_SUMMARY"
          fi
